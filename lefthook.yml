# EngramNote 提交前钩子（lefthook）
#
# ⚠️ 当前【未启用】。
#    启用条件：1) 安装 lefthook 二进制  2) 执行 `lefthook install`
#    仅存在本文件不会触发任何行为（.git/hooks 下目前无自定义钩子）。
#
# 启用步骤见 _governance/01-启用清单.md 第 2 节。
#
# 设计取舍：
#   - pre-commit 只做"秒级"能判的事（格式/lint/密钥）。测试放 pre-push。
#   - 并行执行，目标总耗时 <10s。超过就把 prettier 挪到 pre-push。
#   - 逃生口：SKIP_VERIFY=1 git push（写进 AGENTS.md 后再启用）。

pre-commit:
  parallel: true
  commands:
    # 【解释器选择】ruff 必须用装了 ruff 的那个 python 跑。
    # 2026-11-07 实测踩坑：默认 `python` 指向 D:\miniforge3\python.exe（base 环境），
    # 没装 ruff → 钩子报 "No module named ruff"，看起来像代码有问题，其实是环境选错。
    #
    # 解决：用 ${PYTHON:-python}。启用前请把 PYTHON 设为项目环境，例如：
    #   setx PYTHON "D:\conda\envs\aiforlearn\python.exe"
    # 或每次会话：$env:PYTHON = "D:\conda\envs\aiforlearn\python.exe"
    ruff-check:
      glob: "*.py"
      root: "backend/"
      stage_fixed: true
      run: ${PYTHON:-python} -m ruff check --fix {staged_files}

    ruff-format:
      glob: "*.py"
      root: "backend/"
      stage_fixed: true
      run: ${PYTHON:-python} -m ruff format {staged_files}

    eslint:
      glob: "*.{ts,tsx}"
      root: "frontend/"
      run: npx eslint --fix {staged_files} && git add {staged_files}

    prettier:
      glob: "*.{ts,tsx,css,md,json}"
      root: "frontend/"
      run: npx prettier --write {staged_files} && git add {staged_files}

    # 依赖 gitleaks：启用前必须先装（scoop install gitleaks / choco install gitleaks）
    secrets:
      run: gitleaks protect --staged --redact

pre-push:
  # 【当前未启用】2026-11-07 决策：只装 pre-commit。
  # 理由：后端 1760 个用例全量约 32 分钟（实测），不可能进钩子；
  # 前端 vitest 也要 34-39s，push 时会让人犹豫。这类检查交给 CI。
  # 想开启时把下面的注释去掉，并在 AGENTS.md 写明 SKIP_VERIFY=1 逃生口。
  #
  # commands:
  #   vitest:
  #     root: "frontend/"
  #     run: npx vitest run --reporter=dot
  skip: true
