# ruff 配置(最小规则集,遵循项目最小依赖原则)
# 用法(在 backend/ 目录):
#   python -m ruff check .        # 检查问题
#   python -m ruff check . --fix  # 自动修复(仅安全项)
#   python -m ruff format .       # 统一格式
line-length = 120
target-version = "py310"

[lint]
# E4/E7/E9 + F = ruff 默认核心规则(语法/未使用导入/未定义名等)
# B = flake8-bugbear 增强(真实 bug 模式,如裸 except、可变默认参数)
select = ["E4", "E7", "E9", "F", "B"]

# 全项目已知无法避免的例外在此声明(与报告一并评审后再收敛)
ignore = [
    # FastAPI 标准惯用法:Depends()/Query() 写在参数默认值中,并非 bug
    "B008",
]

[lint.per-file-ignores]
# 迁移脚本/一次性脚本放行未使用导入等噪音
"alembic/versions/*.py" = ["E501"]
"scripts/*.py" = ["E501"]

# 历史测试脚本：这批文件是在"测试从未真正运行过"的时期写的，
# 存量问题（裸 except 吞掉一切、未使用变量、模块级代码在 import 时执行）不阻断 CI，
# 以免为了修 lint 反而掩盖它们本身的逻辑问题。
# ⚠️ app/ 不在此列 —— 生产代码必须完全通过检查（CI 已强制）。
# 收敛方向：测试迁移到正式用例时逐个去掉本豁免。
"tests/**/*.py" = ["E722", "E402", "E712", "F841", "B007", "B011"]