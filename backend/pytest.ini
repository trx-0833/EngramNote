[pytest]
# 测试发现范围：只收集单元/回归测试。
#
# tests/integration/ 下的文件是**需要真实外部服务**的集成脚本（会调用真实
# LLM API、写入真实数据），默认不收集 —— 否则 `pytest` 会在收集阶段
# 就发起真实请求并消耗额度（历史实测：8 个文件在 collect 阶段触网）。
# 显式运行方式：
#     ENGRAMNOTE_ALLOW_NETWORK_TESTS=1 python -m pytest tests/integration -m integration
testpaths = tests
norecursedirs = tests/integration data data_backup_e2e __pycache__ .pytest_cache

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 注册自定义 marker，避免 PytestUnknownMarkWarning
markers =
    integration: 需要真实网络/外部 API 的用例（默认跳过）
    slow: 耗时用例

# 输出更可读的失败信息
addopts = -ra --strict-markers

filterwarnings =
    ignore::DeprecationWarning
