server {
    listen 80;
    server_name _;

    # 上传体积上限。
    # nginx 默认 client_max_body_size 只有 1MB，而本产品的核心是上传
    # PDF / 视频 / 音频（后端 config.max_upload_size_mb 默认 500MB）。
    # 缺这一行的后果是：**Docker 部署下所有 >1MB 的上传必然返回 413**，
    # 且请求根本没到达后端（后端日志里什么都看不到）。
    # 开发环境走 Vite 代理没有该限制，所以这个 bug 只在生产暴露。
    client_max_body_size 500m;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 路由回退：所有未匹配的路径都返回 index.html
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物：可长期强缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 绝不缓存。
    # 否则 SPA 发版后用户会拿到旧 HTML，去引用已被删除的 hash 资源 → 白屏。
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API 反向代理到后端服务
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关闭响应缓冲。
        # nginx 默认 proxy_buffering on，会把上游响应先缓冲再成块下发；
        # 后果是 SSE 流式问答（/api/understanding/ask/stream、
        # /api/notes/{id}/ask/stream）在生产环境**退化成"一次性吐出"** ——
        # 用户看到"AI 正在思考"一直不动，然后整段答案突然出现，
        # 首 token 流式与"停止生成"按钮全部失去意义。
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 超时设置（理解管道可能耗时较长；LLM 单次超时可达 600s）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    # 缺少 gzip_vary 时，中间代理/CDN 可能把 gzip 内容发给不支持压缩的客户端
    gzip_vary on;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
