# EngramNote Docker Compose 配置
# 开发模式：仅 backend + frontend（使用 SQLite + 文件系统 broker）
# 生产模式：包含 PostgreSQL + Redis + MinIO

services:
  # ---- 应用服务 ----

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据目录
      - backend-data:/app/data
      # 挂载 .env 配置文件（包含 API 密钥等敏感信息）
      - ./backend/.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

