name: 功能建议
description: 提出一个新功能或改进（请先看下面的"已否决方向"）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 先看"已否决的方向"，这几类不要再提

        本项目在资源约束下**已经明确放弃**下面的方向（`AGENTS.md:13-18`），
        相关 issue 会被直接关闭：

        - 更换数据库引擎，或引入外部中间件（消息队列 / 缓存服务）——
          `backend/requirements.txt:31` 写明不引入 `asyncpg` / `minio` / `redis`；
        - 恢复已被替换掉的旧存储或索引方案（例如把向量挪回独立的向量库）；
        - 引入与现有机制并行的**第二套**数据库迁移工具；
        - 容器化部署（历史遗留、未经验证 —— `README.md:324-336`）。

        另外：本项目自托管的定位是"零外部依赖"（SQLite + 文件系统 broker，
        `README.md:51`），要求引入常驻服务的方案基本都会被拒。

        提之前建议先看 `docs/overhaul-plan.md` 附录 BN（`:11145`）的**未做事项总表**——
        你说的功能可能已经登记过，并且写清了为什么现在不做。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请描述**处境**而不是只给方案。哪一步卡住了？现在你是怎么绕过去的？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么做
      description: 具体的交互 / 接口 / 数据形态越清楚越好；如果你已经看过相关代码，请给 `文件:行号`
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括"不改代码也能凑合"的办法，以及它们的代价
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: 这个改动会动到什么
      description: 影响面决定了它要不要单独排一期；不确定就选"不确定"（多选）
      multiple: true
      options:
        - 只是前端界面 / 交互
        - 后端接口契约（会需要重跑 openapi.json 与 gen:api）
        - 数据库 schema（需要前滚迁移，见 UPGRADING.md）
        - 依赖清单（requirements*.txt / package.json）
        - 需要新的外部服务或密钥（很可能被拒）
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已读过上面的"已否决方向"，本建议不属于其中任何一类
          required: true
        - label: 我愿意自己提 PR（可选）
          required: false
