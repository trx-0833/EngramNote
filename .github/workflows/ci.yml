name: CI

# 本项目此前**没有任何 CI**（无 .github/），后果是：
# - 测试在收集阶段就发起真实网络请求并消耗 LLM 额度，无人发现
# - 前端重构后后端测试仍在断言旧文件结构，无人发现
# - ruff / eslint / prettier 报告只以文本文件形式提交到 docs/，不阻断合并
#
# 这个 workflow 的目标不是"跑得好看"，而是让上面三类问题在 PR 阶段就失败。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests, offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 依赖清单来自 backend/requirements-test.txt（**单一来源**）。
          #
          # 为什么不再手抄在此：最初这里是一份手抄的精简清单，结果漏掉了
          # requirements.txt 里的 numpy —— 而 graph_service.py / asr_engine.py
          # 在模块顶层就 import numpy，导致 CI 上 64 failed / 4 errors，
          # 本机却全绿（本机装的是全套依赖，掩盖了缺失）。手抄必然漂移。
          #
          # requirements-test.txt 是 requirements.txt 的**测试子集**：
          # sentence-transformers / chromadb / openai 等 GB 级依赖被排除，
          # 因为单元测试不加载模型（见 tests/conftest.py 的网络守卫）。
          python -m pip install -r requirements-test.txt

      - name: "Ruff lint (app: strict)"
        # 生产代码必须完全干净。此前 app/ 有 5 处问题（含 sessions.py 里
        # 3 处 F821 未定义名），现已全部修复。
        run: python -m ruff check app

      - name: "Ruff lint (tests: grandfathered)"
        # 历史测试脚本的存量问题在 ruff.toml 的 per-file-ignores 中豁免，
        # 但新增的未定义名/语法类问题仍会失败。
        run: python -m ruff check tests

      - name: "Ruff lint (scripts)"
        # scripts/ 此前未纳入 CI，于是静默积累了 4 处问题（1 处死循环、
        # 1 处无用赋值、1 处未使用的循环变量、1 处多余 f 前缀），
        # 现已清零。纳入 CI 是为了让"迁移/备份/校验脚本"这类
        # 直接对真实数据动手的代码保持同等质量门槛。
        run: python -m ruff check scripts

      - name: Ruff format check
        run: python -m ruff format --check app tests
        continue-on-error: true

      - name: Pytest (offline; real network is blocked by tests/conftest.py)
        # 环境变量显式声明"禁止联网测试"，让守卫的意图在 CI 里可见。
        # integration 用例会被自动跳过（它们需要真实 LLM / MinerU API key）。
        env:
          ENGRAMNOTE_ALLOW_NETWORK_TESTS: "0"
        run: python -m pytest -q

      # 检索质量评测（阶段 2.9）刻意**不**放在 CI 里：
      #   - CI 上没有真实资料库（`backend/data/` 被 .gitignore 忽略），
      #     评测集为空、脚本退出码 2，加了 `|| true` 又等于永不失败 ——
      #     那种步骤只是装饰。
      #   - 绝对指标取决于真实资料内容，写成阈值门禁会在资料更新时误报，
      #     结果是这个评测被绕过，比没有更糟。
      # 它的守护放在 `tests/test_rag_retrieval.py::TestRetrievalEvalHarness`：
      # 锁判据行为（对无关内容 0 分、对包含内容满分、长度中立），
      # 并在本机真实库上端到端跑一次 CLI。
      # 人工基线：`python scripts/eval_retrieval.py --corpus both`

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # 用 npm ci 而非 npm install：仓库已有 package-lock.json，
        # ci 保证构建可复现（install 会忽略锁文件并可能升级依赖）。
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check
        continue-on-error: true

      - name: Vitest (unit + component, jsdom)
        # 这一层是**阻断性**的，与 format:check 不同。
        #
        # 为什么必须有：在附录 Z / AA 两轮里前端只有 tsc + eslint + build
        # 三道**静态**检查，它们发现不了"正文在翻面前就露出来了""勾了语义
        # 判分但回车提交没带上"这类**运行时**错误 —— 而后者正是那两轮
        # 真实踩到的坑（后一个 TypeScript 完全通过）。
        #
        # 用例保持在纯前端范围内：所有 API 模块都被 vi.mock 掉，
        # 不发真实请求，因此不需要后端或数据库。
        run: npm test

      - name: TypeScript + build
        run: npm run build

      - name: Cache Playwright browsers
        # 只缓存 Chromium（见下一节）：Playwright 的浏览器是 ~430MB 的独立二进制，
        # 每次 CI 重下会白白多花几分钟。缓存键绑在 package-lock.json 上 ——
        # 版本一变键就变，不会出现"缓存里是旧 revision、测试却以为装好了"。
        #
        # 缓存的是下载后的浏览器目录，**不包含** `playwright install` 的其他副作用，
        # 所以下一节的安装步骤无论缓存命中与否都必须执行（命中时它只是快速校验）。
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium for E2E
        # 只装 Chromium，**绝不** `playwright install`（不带参数 = 三个浏览器全下）。
        #
        # `--with-deps` 在 ubuntu runner 上是必需的：它补齐 headless Chromium
        # 依赖的系统库；缺了会得到 "Host system is missing dependencies" 类的报错。
        # 注意 `--with-deps` 需要 sudo 装 apt 包，所以这一条不能只靠缓存跳过。
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (blocking)
        # 这一层是**阻断性**的，与 format:check 不同。
        #
        # 为什么值得阻断：它是本仓库唯一跑在**真浏览器**里的一层 ——
        # tsc / eslint / build 三道静态检查全是绿的也可能出问题，而本层首次
        # 启用就当场抓到一条真实缺陷（从 `/login` 登录成功后会落到 404：
        # 已登录路由表里没有 `/login`，且登录成功后没有任何跳转）。
        # 那条缺陷在 Vitest 里永远看不见 —— jsdom 里路由是 mock 出来的路径，
        # 真实地址栏、真实 history、真实 SPA fallback 都不参与。
        #
        # 成本可控：全部用例用 `page.route` 桩掉 `/api`，彼此不共享状态、
        # 不需要后端/数据库，本机实测 9~10 条用例约 10~17 秒。
        #
        # `npm run e2e` 是自洽的：dev server 由 playwright.config.ts 的
        # webServer 自动拉起与关闭（端口 4319、--strictPort），
        # CI 里**不需要**另外起服务，也不能改成复用已存在的服务 ——
        # 复用会让"测的到底是哪份代码"不可知（见 playwright.config.ts 注释）。
        timeout-minutes: 10
        run: npm run e2e

  security-scan:
    name: Security scan (advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # ── 为什么这个 job 是"建议性"的（不会让构建变红） ──────────────────────
    #
    # 扫描**必须跑**，但**不能**成为合并门禁。两条实测理由：
    #
    # 1. 它今天必然会报出**按设计无法修**的发现：11 条 npm 建议全部落在
    #    构建/测试工具链里，另有 1 条上游明确表示"不会有修复"的 Python 建议。
    # 2. 另有一批发现只存在于 requirements 的**声明路径**上（pip-audit 用
    #    `-r` 解析全新安装会拿到的版本集合），本机实际环境与它并不一致。
    #
    # 于是今天若拿 `--fail-on high` 当门禁，CI 会**长期常红**。常红的门禁只有
    # 一个结局：被人加 `|| true` 或直接删掉 —— 那比没有门禁更糟，因为它会
    # 制造"我们已经在管安全了"的假象。所以这里的选择是：
    # **跑它、归档报告、把它摆到明面上（job summary + 注解），但不阻断合并。**
    #
    # 门禁的**正确**升级路径是先把上面两类发现处理掉（或在脚本里显式豁免并
    # 写明理由），再把 `--fail-on` 换成具体阈值。在那之前不装作已经守住了。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install scan dependencies
        # pip-audit 是脚本的**必需**扫描器之一（装不上 → 退出码 2）。
        # 不钉版本：本 job 是建议性的，钉住反而会在漏洞库换代时增加维护面；
        # 扫描器版本会随 JSON 报告一起归档，结果永远可追溯。
        run: python -m pip install pip-audit

      - name: Install frontend dependencies
        # `npm audit` 是另一个必需扫描器，它读 frontend/package-lock.json。
        # 用与 frontend job 完全相同的 `npm ci`（同一份锁文件、同一条路径）——
        # 这里刻意不换花样：两个 job 对"前端依赖装出来是什么样"必须一致，
        # 否则扫描结果描述的就不是被测试的那棵树。
        run: npm ci
        working-directory: frontend

      - name: Run security scan (report only, never blocks)
        id: scan
        # 输出 JSON 报告供归档。脚本在**内部**已修好 Windows/GBK 下 pip-audit
        # 崩溃、镜像源没有 audit 端点这两个坑（见 security_scan.py 文件头）。
        run: |
          set -o pipefail
          # `|| true` 在这里的作用域是**最小**的：只吃掉脚本自己的退出码，
          # 随后的步骤会把它翻译成可见的状态。绝不能在这里静默了事。
          python scripts/security_scan.py --json-out ../security-scan-report.json 2>&1 | tee security-scan.log || true
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Report scanner status
        # ── 退出码 2 的处理决定（这是本 job 里唯一需要动脑的地方） ──────────
        #
        # 退出码含义：0 = 跑完了没发现 / 1 = 有发现达阈值（本 job 不用）/ 
        # 2 = **必需的扫描器没能运行**（pip-audit 未安装、npm audit 失败、
        #     网络不通导致公告库拉不下来）。
        #
        # 决定：**不因 2 而失败构建，但把它变成无法忽略的可见状态。**
        #
        # 为什么不失败：code 2 的主因是网络/环境，而不是本次提交引入了什么。
        # 让一次 registry 抖动把 PR 变红，属于"红灯指向的原因不是代码" —— 
        # 这正是上面那条"常红 → 被 `|| true`"路径的起点。安全结论的缺失
        # 不该以"某个提交有罪"的形式表达。
        #
        # 为什么不静默：静默就是本仓库反复踩到的"配置了却从未真正执行" 
        # （rate limit 规则从未匹配、CI 依赖清单漂移、扫描器一次没跑过）。
        # 所以 code 2 会：写进 job summary、打 ::warning 注解（在 PR 的
        # Files/Checks 界面上直接可见）、把 JSON 报告归档、并保留原始输出。
        #
        # 唯一的硬失败是"连报告文件都没产出"：那是**这个 job 自己**坏了，
        # 与扫描器在目标机器上能否联网无关，必须红。
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          set -euo pipefail
          REPORT=../security-scan-report.json

          if [ ! -f "$REPORT" ]; then
            echo "::error::扫描脚本未产出报告文件 $REPORT（退出码 ${EXIT_CODE}）—— 这一步本身失败了，不是扫描器的问题"
            exit 1
          fi

          MISSING=$(python - <<'PY'
          import json, pathlib
          r = json.loads(pathlib.Path("../security-scan-report.json").read_text(encoding="utf-8"))
          missing = []
          if not r["python"].get("available") and not r["python"].get("skipped"):
              missing.append("pip-audit")
          for scan in r["python"].get("scans", []):
              if not scan.get("ok"):
                  missing.append("pip-audit:" + str(scan.get("target")))
          if not r["node"].get("ok") and not r["node"].get("skipped"):
              missing.append("npm audit")
          print("、".join(missing))
          PY
          )

          {
            echo "## 依赖安全扫描（建议性，不阻断合并）"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 退出码 | \`${EXIT_CODE}\`（0=完成 / 1=达阈值 / 2=必需扫描器没跑起来） |"
            echo "| 未运行的必需扫描器 | ${MISSING:-无} |"
            echo "| 完整 JSON 报告 | 见本 job 的构建产物 \`security-scan-report\` |"
            echo ""
            echo "判定为建议性的理由、以及升级成门禁的前置条件，见 \`.github/workflows/ci.yml\` 中本 job 的注释。"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$EXIT_CODE" = "2" ]; then
            echo "::warning::安全扫描的必需扫描器未能运行（$MISSING）。本次**没有**得到任何安全结论 —— 这既不是「没问题」也不是「发现了问题」，而是「扫描没跑成」。请检查网络/扫描器可用性后重跑。"
          elif [ "$EXIT_CODE" = "1" ]; then
            echo "::warning::安全扫描有发现达到阈值（本 job 未启用 --fail-on，故不阻断）"
          else
            echo "扫描完成：必需扫描器全部运行。"
          fi

          echo "──────── 扫描输出（完整日志随构建产物归档） ────────"
          cat security-scan.log

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          # 两个文件都保留：JSON 供机器读，日志供人读（含"哪个扫描器没跑"的原因）
          path: |
            backend/security-scan-report.json
            backend/security-scan.log
          if-no-files-found: error
          retention-days: 30

  docker-nginx-config:
    name: Docker build context sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: nginx config must set client_max_body_size
        # 回归守卫：nginx 默认 client_max_body_size 只有 1MB，
        # 而产品核心是上传 PDF/视频。缺这一行会让生产环境所有 >1MB 上传 413。
        run: |
          if ! grep -q "client_max_body_size" frontend/nginx.conf; then
            echo "::error::frontend/nginx.conf 缺少 client_max_body_size（上传会被 nginx 以 413 拒绝）"
            exit 1
          fi

      - name: nginx config must disable proxy_buffering for SSE
        # 回归守卫：proxy_buffering 默认 on，会把 SSE 流式响应缓冲成一次性返回。
        run: |
          if ! grep -q "proxy_buffering off" frontend/nginx.conf; then
            echo "::error::frontend/nginx.conf 缺少 proxy_buffering off（流式问答在生产会失效）"
            exit 1
          fi

      - name: frontend .dockerignore must exclude node_modules
        # 回归守卫：缺少它会让宿主 node_modules 覆盖镜像内依赖，Linux 构建失败。
        run: |
          if [ ! -f frontend/.dockerignore ] || ! grep -q "node_modules" frontend/.dockerignore; then
            echo "::error::frontend/.dockerignore 缺失或未排除 node_modules"
            exit 1
          fi
