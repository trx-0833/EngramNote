# Dependabot 配置
# ================
#
# ## 为什么只有三个 ecosystem，以及为什么"每周一次"
#
# 本项目的依赖面只有三处（`pyproject.toml:22-28` 把分工写得很清楚）：
#   - `pip`  目录 `/backend` —— 三份 requirements*.txt 都在这里
#     （CI 装的是 `requirements-test.txt`，见 `.github/workflows/ci.yml:51`）
#   - `npm`  目录 `/frontend` —— `package.json` + `package-lock.json`
#     （CI 与前端 job 都用 `npm ci`，见 `ci.yml:205`）
#   - `github-actions` 目录 `/` —— workflow 里 `uses:` 的 action 版本
#     （`ci.yml` 用了 checkout / setup-python / setup-node / cache / upload-artifact）
#
# 每周一次、而不是每天：这是单人项目，PR 需要人来读；
# 每天开 PR 的结果是积压 —— 而积压的依赖 PR 最后总是被批量关掉，
# 那等于没开（这个仓库对"配置了却从未真正执行"的东西特别警惕，
# 见 `docs/overhaul-plan.md:3320` 与 `docs/security-scan.md:494-495`）。
#
# ## ⚠️ `open-pull-requests-limit` 管的是 **PR 数**，不是**分支数**
#
# 这一点在 2026-09-24 的复盘里被实测纠正过一次，写在这里防止再次误判：
#
#   * 该选项只限制**同时开着**的 PR 数量。PR 一旦被合并或关闭，名额立刻腾出。
#   * **而分支不会随 PR 一起消失** —— `dependabot/*` 分支只有被人或脚本
#     显式删除才会消失。
#
# 于是"分支越积越多"的真实成因是"没人删"，不是"限额太高"：
# 当时仓库里有 **15 个分支**，其中 13 个是**已经关掉、分支还躺着**的。
# 清理机制见 `.github/workflows/cleanup-dependabot-branches.yml`。
#
# 三份 ecosystem 各自计限额，所以 `10` 意味着**理论上限 30 条开放 PR**。
#
# ## 大版本：哪些自动开、哪些不自动开
#
# **不自动开**（`ignore` 里的四个）—— 它们必须**联动升级**，单独开 PR 只会
# 得到一个红色 PR 然后等人去关：
#
#   * `vite` 与 `@vitejs/plugin-react`：plugin-react 4.x 的 peer 是
#     `vite: ^4 || ^5 || ^6 || ^7`，**不含 ^8**；只升 vite 会 ERESOLVE。
#   * `vitest`：2.x 与 vite 8 的配置契约不兼容（3.x 起才跟上）。
#   * `jsdom`：它的 `engines.node` 就是本仓库 `package.json` 里
#     `engines.node` 的来源，升级它可能抬高 Node 下界。
#
#   这四者的人工升级步骤见 `frontend/.npmrc` 相邻的提交记录与
#   `docs/open-source-readiness.md` §执行进度（批次 9）。**不是不升**，
#   是"由人挑一个时间点、四条一起升、跑完整门禁"。
#
# **仍然自动开**：其余依赖（如 `react-router-dom`、`marked`）与 `pip` 侧
# （如 `alembic`）的大版本 —— 它们能独立验证，让人看见比藏起来好。
# 实测依据：2026-09-24 那一轮里 `marked 14→18`、`react-router-dom 6→7`
# 都是单个依赖独立升级并各自跑绿门禁的。
#
# ## 分组策略（groups）—— 为什么这么分
#
# **把 minor / patch 合并成一个 PR，把 major 留成独立 PR。**
# 理由有两条，都来自本仓库的现状：
#
# 1. `backend/requirements.txt:19-24` 用 `~=` 锁**主次**版本，允许补丁浮动；
#    同类小版本的依赖 PR 逐条开，只会得到一堆"改了 requirements.txt 一行"的 PR，
#    而它们的验证方式完全相同（跑一遍门禁）。合并后一轮门禁就能覆盖一批。
# 2. **major 不能混进来**：`docs/security-scan.md:403-409` 记着本项目对跨大版本升级的
#    态度 —— vite 5→8、vitest 2→5、fastapi 升级都会改变应用行为或构建产物，
#    必须单独验证。混进分组 PR 里，审阅者分不清"哪一处升级导致了失败"。
#
# `github-actions` 是**例外**：它的 major 也并进同一个组。理由来自实测 ——
# 2026-09-24 那轮里 `checkout@v7` / `setup-python@v7` / `cache@v6` /
# `upload-artifact@v7` 四个 major 是**一轮门禁一次全绿**，逐条开 PR 只是四次重复劳动。
#
# 刻意**不**用 `dependency-type` 把 dev/prod 分开成更多组：
# npm 侧 `npm ci` 装的是同一棵依赖树，CI 的 `npm test` / `npm run build` 会同时验证两者；
# 分成两组只会让同一批门禁跑两遍。
#
# ## 与安全扫描的关系（别把两者搞混）
#
# Dependabot 负责"把版本提上去"；漏洞扫描（`pip-audit` + `npm audit`）负责"报告已知问题"，
# 后者在 CI 里是**建议性**的（`ci.yml:340-362`，口径见 `docs/security-scan.md:490-532`）。
# 合并依赖 PR 之前，请照常跑 `CONTRIBUTING.md` 第 4 节的门禁 ——
# 依赖 PR **不是**免检通道。

version: 2

updates:
  # ---- Python：backend/requirements*.txt ----
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    assignees:
      - trx-0833
    groups:
      # 小版本与补丁合并成一个 PR（见文件头的分组策略）
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---- Node：frontend/package.json + package-lock.json ----
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    assignees:
      - trx-0833
    # 必须联动升级的四个 → 不自动开 major PR（理由见文件头）
    ignore:
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # ⚠️ `frontend/package.json:73-75` 的 `engines.node` 是 jsdom@30 自己的要求
    # （`^22.22.2 || ^24.15.0 || >=26.0.0`），升级 jsdom / vitest 时务必一起看
    # 这一步会不会把 Node 下界抬高 —— `npm ci` 对 engines 不匹配**只警告不失败**
    # （`ci.yml:203-204`），装得完但 `npm test` 会报一句与原因无关的 `Test Files  no tests`。

  # ---- GitHub Actions：.github/workflows/ ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    assignees:
      - trx-0833
    groups:
      # 与 npm/pip 不同：actions 的 **major 也并进同一个组**。
      # 理由（实测）：2026-09-24 那轮里四个 action 的 major
      # （checkout@v7 / setup-python@v7 / cache@v6 / upload-artifact@v7）
      # 是同一轮门禁一次全绿，逐条开 PR 只是四次重复劳动。
      # 注意 `update-types` 省略 = 不限制更新类型（含 major）。
      actions-all:
        patterns:
          - "*"
